<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo azul oscuro con esquinas redondeadas -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#14283f" />

  <!-- Grupo del logo centrado y con margen -->
  <g transform="translate(36, 48)">
    <!-- Cuadrado superior izquierdo (Verde menta) -->
    <rect x="20" y="30" width="124" height="124" rx="28" ry="28" fill="#4ecba6" />
    
    <!-- Cuadrado inferior izquierdo (Amarillo) -->
    <rect x="20" y="174" width="124" height="124" rx="28" ry="28" fill="#f4be67" />
    
    <!-- Cuadrado inferior central (Verde menta - en su posición correcta formando la U) -->
    <rect x="158" y="240" width="124" height="124" rx="28" ry="28" fill="#4ecba6" />
    
    <!-- Cuadrado superior derecho (Lila) -->
    <rect x="296" y="30" width="124" height="124" rx="28" ry="28" fill="#c5b3f2" />
    
    <!-- Cuadrado inferior derecho (Gris azulado) -->
    <rect x="296" y="174" width="124" height="124" rx="28" ry="28" fill="#9ab1cc" />
  </g>
</svg>